<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Unit 3 App Development Review{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .nav-title {
            font-size: 12px;
            color: #9ca3af;
            margin: 20px 10px 10px;
            text-transform: uppercase;
        }

        .nav-link {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .nav-link:hover {
            background: #1f2937;
            color: white;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 30px;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        /* Content */
        .content-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .content-header h2 {
            font-size: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            text-align: left;
            padding: 14px;
            font-size: 13px;
        }

        td {
            padding: 14px;
            border-top: 1px solid #e5e7eb;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: bold;
        }

        .view-btn {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 190px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            Unit <span>3</span>
        </div>

        <div class="nav-title">Main Menu</div>

        <a href="{% url 'dashboard' %}" class="nav-link">
            📊 Dashboard
        </a>

        <a href="{% url 'student_list' %}" class="nav-link">
            👨‍🎓 All Students
        </a>

        <a href="{% url 'add_student' %}" class="nav-link">
            ➕ Add Student
        </a>

        <div class="nav-title">Evaluation</div>

        <a href="{% url 'student_list' %}" class="nav-link">
            📝 Results
        </a>

    </aside>


    <main class="main">

        {% block content %}
        {% endblock %}

    </main>

</div>

</body>
</html>
